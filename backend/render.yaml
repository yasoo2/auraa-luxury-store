services:
  - type: web
    name: auraa-api
    env: python
    region: oregon
    plan: free
    # Render watches the branch itself and redeploys on every push, so no
    # GitHub Actions workflow is involved in shipping the backend.
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # --- Required. The app refuses to start without these. ---------------
      - key: ENV
        value: production

      # Without a pin Render builds on its newest Python, which was 3.14.
      # pydantic_core has no wheel for it, so pip fell back to compiling it
      # with Rust and failed on Render's read-only filesystem. Kept in step
      # with backend/.python-version and the version CI runs.
      - key: PYTHON_VERSION
        value: 3.11.9

      # server.py reads os.environ['MONGO_URL'] and os.environ['DB_NAME']
      # directly, so a missing value is a KeyError at import time, not a
      # warning. DB_NAME was previously declared here as MONGO_DB_NAME, which
      # the code never reads — recreating the service from this blueprint
      # would have failed to boot.
      - key: MONGO_URL
        sync: false
      # Must match the database in MONGO_URL's path. The live data is in
      # `auraa_luxury`; the previous value here was `auraa_luxury_db`, which
      # would have connected to an empty database instead.
      - key: DB_NAME
        value: auraa_luxury

      # core/security.py refuses to start in production rather than sign
      # tokens with a key committed to this repository. Set this to the value
      # from the previous deployment to keep existing sessions valid;
      # generating a new one logs every user out.
      - key: JWT_SECRET_KEY
        sync: false

      # --- Recommended ------------------------------------------------------
      # Comma-separated. Falls back to the auraaluxury hosts when empty.
      - key: CORS_ORIGINS
        sync: false

      # --- Optional: sign in with Google -----------------------------------
      # From an OAuth 2.0 Client ID (type "Web application") in the store's own
      # Google Cloud project. Both must be set or the sign-in page hides the
      # Google button entirely rather than showing one that fails.
      # Authorised redirect URIs on that client must list, exactly:
      #   https://auraaluxury.com/auth/oauth-callback
      #   https://www.auraaluxury.com/auth/oauth-callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Optional: suppliers, email, currency ----------------------------
      - key: CJ_DROPSHIP_API_KEY
        sync: false
      - key: CJ_DROPSHIP_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false

      # Required in production. The API refuses first-admin setup when this
      # value is missing, so the first visitor cannot claim super-admin access.
      - key: ADMIN_SETUP_KEY
        sync: false

      # --- Optional: tuning. Defaults are in the code. ----------------------
      # COOKIE_SECURE=false and COOKIE_CROSS_SITE=false only for local HTTP.
      # AUTH_RATE_LIMIT_MAX / AUTH_RATE_LIMIT_WINDOW tune login throttling.
      # REFRESH_TOKEN_EXPIRE_DAYS defaults to 90.
      # UPLOAD_DIR points media uploads at a mounted disk; Render's default
      # filesystem is ephemeral and loses uploads on every redeploy.
