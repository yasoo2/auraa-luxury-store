<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Auraa Luxury">
  <!-- Auraa Luxury — «الحلقة واللؤلؤة»: حلقة ذهبية مفتوحة تُمسك لؤلؤة.
       اختيار المالك من عشرة اقتراحات (رقم ٢).

       شكل واحد فقط، بلا قرص مصمت ولا تفاصيل دقيقة. سبب ذلك أن الحجم الذي
       تُرى فيه هذه العلامة أكثر من أي حجم آخر هو ١٦-٢٠ بكسل في تبويب
       المتصفّح: الشعار السابق كان قرصاً داكناً بقلادة داخله، فيتحوّل عند
       ذلك الحجم إلى لطخة لا تُقرأ. الحلقة تبقى حلقة، واللؤلؤة تبقى لؤلؤة.

       الحلقة مفتوحة من أعلى لتترك اللؤلؤة مكانها بلا تراكب — لا يُغلق
       الفراغ ولا تُصغَّر اللؤلؤة، فكلاهما يُذيب الشكل عند ١٦ بكسل. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cd7a"/>
      <stop offset="0.55" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8c6d15"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f1e4"/>
      <stop offset="1" stop-color="#ddd2bb"/>
    </radialGradient>
  </defs>

  <!-- الحلقة: دائرة نصف قطرها ٢٠ ومحيطها ١٢٥٫٦٦، والفجوة فيها ٢٦ وحدة.
       مسار الدائرة يبدأ عند الساعة الثالثة ويدور مع عقارب الساعة، فمركز
       الفجوة يقع عند ٣٢٢٫٧ درجة؛ وإدارتها ‎-52.7‎ تنقله إلى ٢٧٠ بالضبط —
       أي إلى أعلى الحلقة تحت اللؤلؤة تماماً. أوّل تصيير أُديرت ‎-77‎
       فمالت الفجوة عن اللؤلؤة بأربعٍ وعشرين درجة وبدا الشكل مائلاً. -->
  <circle cx="32" cy="37" r="20"
          fill="none" stroke="url(#ring)" stroke-width="6.5" stroke-linecap="round"
          stroke-dasharray="99.66 26" transform="rotate(-52.7 32 37)"/>

  <!-- اللؤلؤة، بحدّ ذهبي: بلا هذا الحدّ تختفي على أي خلفية فاتحة. -->
  <circle cx="32" cy="15" r="9.5" fill="url(#pearl)" stroke="#c9a227" stroke-width="1.8"/>
  <circle cx="28.8" cy="11.8" r="2.4" fill="#ffffff" opacity="0.95"/>
</svg>
