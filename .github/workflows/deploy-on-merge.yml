name: Deploy on Merge (Render + Cloudflare)

# Runs only after CI succeeds on main. Previously this fired on every push
# with no build or test in between, which is how a server stripped from 63
# endpoints to 8 reached production unnoticed.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:   # manual re-deploy without a new commit

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on failure too, so the result must be checked.
    # workflow_dispatch has no source run, hence the second condition.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # 1) نشر الباك-إند على Render
      - name: Deploy Backend to Render
        run: curl -sSf -X POST "$RENDER_DEPLOY_HOOK_URL_BACKEND"
        env:
          RENDER_DEPLOY_HOOK_URL_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND }}

      # 2) تفريغ الكاش من Cloudflare
      - name: Purge Cloudflare Cache
        run: |
          curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
