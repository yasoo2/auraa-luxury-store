name: CI

# Actions does not currently start in this repository: every run is recorded as
# startup_failure under a synthetic "BuildFailed" workflow, and this file has
# never produced a single run. That is an account-level block (Actions minutes
# or the spending limit on a private repo, or Actions switched off in settings),
# not a problem with the YAML below — it parses and is complete.
#
# workflow_dispatch is here so the cause can be seen: press "Run workflow" in
# the Actions tab and GitHub states the reason on the run page. Until it starts,
# ./scripts/verify.sh is the only gate this repository has.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — import + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock_motor pytest

      # Catches boot-time breakage (bad imports, names used before definition)
      # before it can reach production.
      - name: Import check
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_db
          JWT_SECRET_KEY: ci-test-secret
          ENV: test
        run: python -c "import server; print(f'{len(server.app.routes)} routes registered')"

      - name: Integration tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_db
          JWT_SECRET_KEY: ci-test-secret
          ENV: test
        run: python -m pytest tests/test_integration.py -v

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: package-lock.json is gitignored, and pointing
      # setup-node's cache at a missing file fails the job outright.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          CI: false  # CRA treats warnings as errors under CI otherwise
        run: npm run build
