<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!-- The blank-page watchdog.
             First script in the document on purpose: when the app fails to
             start, nothing inside the app bundle can help, because the bundle
             is the thing that did not run. So the recovery has to live here, in
             the HTML itself.

             If nothing has been drawn a few seconds after load, the caches and
             the service worker are cleared and the page is reloaded once — that
             repairs a stale shell pointing at a bundle that no longer exists,
             and a script that came back as HTML. It runs at most once per
             session, so it can never become a reload loop; if the page is still
             blank afterwards it says so plainly instead of pretending to work. -->
        <script>
            (function () {
                var TRIED = 'auraa-blank-recovery';

                // What actually went wrong, recorded as it happens. The first
                // version of this watchdog said only "the store could not
                // start" — true, useless, and the same sin as a spinner that
                // never explains itself: the owner was left staring at a
                // sentence that named nothing he could act on, and it could not
                // be diagnosed from anywhere else because the failure is on his
                // machine, not on the server.
                var faults = [];
                var note = function (text) {
                    if (text && faults.indexOf(text) === -1 && faults.length < 4) faults.push(text);
                };
                window.addEventListener('error', function (e) {
                    if (e && e.target && e.target !== window && e.target.src) {
                        // A <script> or <link> that never loaded: the URL is the
                        // whole diagnosis.
                        note('لم يُحمَّل / failed to load: ' + String(e.target.src).replace(location.origin, ''));
                    } else if (e && e.message) {
                        note(e.message + (e.filename ? ' @ ' + String(e.filename).replace(location.origin, '') : ''));
                    }
                }, true);
                window.addEventListener('unhandledrejection', function (e) {
                    var r = e && e.reason;
                    note('promise: ' + ((r && (r.message || r)) || 'unknown'));
                });

                var esc = function (s) {
                    return String(s).replace(/[<>&"]/g, function (c) {
                        return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
                    });
                };

                window.addEventListener('load', function () {
                    setTimeout(function () {
                        var root = document.getElementById('root');
                        if (!root || root.childElementCount > 0) return;

                        var tried;
                        try { tried = sessionStorage.getItem(TRIED); } catch (e) { tried = '1'; }
                        if (tried) {
                            var why = faults.length
                                ? faults.map(esc).join('<br>')
                                : 'لم يُبلِّغ المتصفّح عن خطأ — الحزمة حُمِّلت ولم تُشغِّل شيئاً.'
                                  + '<br>No error was reported: the bundle loaded and rendered nothing.';
                            root.innerHTML =
                                '<div style="font-family:system-ui;text-align:center;padding:3rem;line-height:1.9">'
                                + '<h1 style="font-size:1.25rem">تعذّر تشغيل المتجر</h1>'
                                + '<p>The store could not start.</p>'
                                + '<p style="color:#777;font-size:.9rem">أُفرغت الذاكرة المؤقتة وأُعيد التحميل مرّة، ولم تُحلّ المشكلة.'
                                + '<br>The cache was cleared and the page reloaded once; that did not fix it.</p>'
                                + '<pre dir="ltr" style="margin:1.2rem auto;max-width:46rem;text-align:start;'
                                + 'white-space:pre-wrap;word-break:break-word;background:#f6f6f6;border:1px solid #e3e3e3;'
                                + 'border-radius:.5rem;padding:.9rem;color:#444;font-size:.8rem">' + why + '</pre>'
                                + '<button onclick="location.reload()" style="margin-top:.4rem;padding:.6rem 1.4rem;'
                                + 'border:1px solid #bbb;border-radius:.5rem;background:#fff;cursor:pointer">'
                                + 'إعادة المحاولة / Try again</button></div>';
                            return;
                        }
                        try { sessionStorage.setItem(TRIED, String(Date.now())); } catch (e) { /* private mode */ }

                        var jobs = [];
                        if (window.caches && caches.keys) {
                            jobs.push(caches.keys().then(function (keys) {
                                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                            }));
                        }
                        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                                return Promise.all(regs.map(function (r) { return r.unregister(); }));
                            }));
                        }
                        // location.reload() is served from the HTTP cache, which
                        // Cache Storage and the service worker have nothing to do
                        // with. A shell cached there keeps pointing at the same
                        // dead bundle no matter how much else is cleared, so the
                        // retry has to ask for a URL the cache has never seen.
                        var retry = function () {
                            var url = location.pathname
                                + (location.search ? location.search + '&' : '?')
                                + '_retry=' + Date.now() + location.hash;
                            location.replace(url);
                        };
                        Promise.all(jobs).then(retry, retry);
                    }, 8000);
                });
            })();
        </script>

        <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=3" type="image/svg+xml" />
        <!-- iOS home-screen icons must be PNG; Safari ignores SVG here. -->
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png?v=3" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#D97706" />
        
        <!-- AGGRESSIVE CACHE PREVENTION - Force fresh content -->
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />

        
        <!-- PWA Support -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Auraa Luxury" />
        
        <!-- Preconnect to external domains -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>Auraa Luxury | Premium Accessories Store</title>
        
        <!-- Cloudflare Turnstile was loaded here on every page for a widget that
             only ever appeared on /auth, failed to render there, and was never
             verified server-side. Re-add these three lines alongside a valid
             sitekey and a siteverify call in the backend if bot protection is
             wanted. -->

        <!-- Google Analytics 4 -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-C44D1325QM"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-C44D1325QM', {
                'send_page_view': true
            });
        </script>
        
        <!-- Two session-recording scripts used to sit here, left over from a
             testing setup and marked "do not edit or remove them". They were
             synchronous and in the head, so the browser had to download and run
             both — one of them `rrweb@latest` from unpkg — before it would even
             parse the body. Whenever that CDN was slow, rate-limited or blocked,
             the shop was a blank white page: no header, no products, nothing.
             That is a live store held hostage by a third party it did not need;
             no code in this app ever called rrweb. Removed.

             Anything added here in future must carry `async` or `defer`. A
             storefront must never wait on another company's server to draw
             its first pixel. -->
    </head>
